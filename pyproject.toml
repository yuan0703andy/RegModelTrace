[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "regmodeltrace"
version = "1.0.0"
description = "Auditable local RAG for regulatory technical documents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Andy Hou"}]
dependencies = [
  "fastapi>=0.115",
  "numpy>=1.26",
  "pydantic>=2.9",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
documents = ["jsonschema==4.25.1", "pyarrow==21.0.0", "pypdf==6.10.0"]
retrieval = ["torch", "transformers"]
gpu = ["vllm==0.29.0", "ray[data]"]
dev = ["ruff>=0.8"]

[project.scripts]
regmodeltrace = "regmodeltrace.__main__:main"

[tool.setuptools.packages.find]
include = ["regmodeltrace*"]

[tool.ruff]
line-length = 100
target-version = "py311"

