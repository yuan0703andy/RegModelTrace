name: release-checks

on:
  push:
  pull_request:

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run host-contract tests
        run: python -m unittest discover -s regmodeltrace/tests -v
      - name: Verify compact release
        run: python scripts/verify_release.py

